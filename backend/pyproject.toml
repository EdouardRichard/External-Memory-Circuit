[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-mcp"
version = "3.1.0"
description = "AI Engineering RAG MCP Server - Minimum RAG MCP Loop"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",

    # Vector store
    "qdrant-client>=1.12.0",

    # LLM / Embedding orchestration
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-community>=0.3.14",

    # MCP
    "mcp>=1.2.0",

    # Parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "markdown-it-py>=3.0.0",
    "sqlparse>=0.5.0",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "pyyaml>=6.0.0",

    # 008: universal format conversion (core dep, FR-014; only xlsx/pptx extras, not [all])
    "markitdown[xlsx,pptx]==0.1.7",

    # CJK tokenization (002 hybrid retrieval)
    "jieba>=0.42.1",

    # Utilities
    "snowflake-id>=0.1.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",

    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.3.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rag_mcp.agents" = ["*.schema.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Function-scoped event loops for fixtures (tests already default to function
# scope): the conftest engine fixture creates a fresh asyncpg engine per test,
# so a session-scoped fixture loop would leave connections attached to a stale
# loop ("attached to a different loop" RuntimeError).
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
